services:
  web:
    build: .
    container_name: recipe-manager
    ports:
      # host:container — the app listens on 8000 inside the container.
      - "6769:8000"
    volumes:
      # Persist the SQLite database on the host so data survives restarts/upgrades.
      - ./data:/data
    environment:
      # Path to the SQLite file inside the container (matches the mounted volume).
      DATABASE_PATH: /data/recipes.db
      # Default unit system for display and shopping lists: "metric" or "imperial".
      DEFAULT_UNIT_SYSTEM: metric
    restart: unless-stopped
