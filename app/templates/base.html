<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sizzle{% endblock %}</title>
  <script>
    (function () {
      var theme = localStorage.getItem("sizzle-theme") || "dark";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/print.css" media="print">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">🔥 Sizzle</a>
      <nav class="site-nav">
        <a href="/">All recipes</a>
        <a href="/shopping-list">Shopping list</a>
        <button type="button" id="theme-toggle" class="btn btn-round" title="Toggle light/dark theme" aria-label="Toggle light/dark theme"></button>
        <a href="/recipes/add" class="btn btn-primary">Add recipe</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Sizzle — self-hosted recipe manager</span>
    </div>
  </footer>

  <script src="/static/js/theme.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
